<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organisateur - Course à Pied</title>
  <style>

    :root {
      --bg-page: #e9ecef;
      --text-color: #495057;
      --primary-color: #007bff;
      --primary-hover: #0056b3;
      --secondary-color: #000000;
      --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      --radius: 10px;
      --transition-speed: 0.3s;
    }

    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Arial', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      font-size: 2.5em;
      color: var(--primary-color);
      margin-bottom: 30px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 10px;
    }

    .dashboard {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .dashboard .card {
      background-color: #ffffff;
      padding: 20px;
      flex: 1 1 30%;
      box-shadow: var(--box-shadow);
      border-radius: var(--radius);
      text-align: center;
      transition: transform var(--transition-speed);
    }
    .dashboard .card:hover {
      transform: scale(1.02);
    }
    .dashboard .card h3 {
      color: var(--secondary-color);
      margin-bottom: 10px;
    }

    .manage-courses {
      background-color: #ffffff;
      padding: 20px;
      box-shadow: var(--box-shadow);
      border-radius: var(--radius);
      margin-bottom: 20px;
      transition: transform var(--transition-speed);
    }
    .manage-courses:hover {
      transform: scale(1.01);
    }
    .manage-courses h2 {
      text-align: center;
      color: var(--secondary-color);
      margin-bottom: 20px;
    }
    .button {
      background-color: var(--primary-color);
      color: #fff;
      padding: 10px 15px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color var(--transition-speed), transform var(--transition-speed);
    }
    .button:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    table, th, td {
      border: 1px solid #ddd;
    }
    th, td {
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: var(--primary-color);
      color: #fff;
    }

    @media (max-width: 600px) {
      .dashboard {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    Tableau de Bord de l'Organisateur
  </header>
  <div class="container">
    <!-- Tableau de Bord -->
    <div class="dashboard">
      <div class="card">
        <h3>Courses Actives</h3>
        <p>5</p>
      </div>
      <div class="card">
        <h3>Participants Inscrits</h3>
        <p>250</p>
      </div>
      <div class="card">
        <h3>Prochaine Course</h3>
        <p>10 Mars 2025</p>
      </div>
    </div>
    <!-- Gestion des Courses -->
    <div class="manage-courses">
      <h2>Gestion des Courses</h2>
      <button class="button">Créer une Nouvelle Course</button>
      <table>
        <tr>
          <th>Nom de la Course</th>
          <th>Distance</th>
          <th>État</th>
          <th>Actions</th>
        </tr>
        <tr>
          <td>100m Sprint</td>
          <td>100m</td>
          <td>En cours</td>
          <td><button class="button">Détails</button></td>
        </tr>
        <tr>
          <td>Marathon</td>
          <td>42.195km</td>
          <td>À venir</td>
          <td><button class="button">Détails</button></td>
        </tr>
        <tr>
          <td>Relais 4x400m</td>
          <td>1600m</td>
          <td>Terminé</td>
          <td><button class="button">Résultats</button></td>
        </tr>
      </table>
    </div>
  </div>
</body>
</html>
